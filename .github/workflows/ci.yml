name: CI

on:
    pull_request:
    push:
        branches: main

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Checkout node
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: "npm"

            - name: Install
              run: npm ci

            - name: Test
              run: npm test

            - name: Build
              run: npm run build
