name: CI

on:
    pull_request:
    push:
        branches: main

permissions:
    contents: read
    pages: write
    id-token: write

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Checkout node
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: "npm"

            - name: Install
              run: npm ci

            - name: Test
              run: npm test

            - name: Build
              run: npm run build

            - name: Upload static files as artifact
              id: deployment
              uses: actions/upload-pages-artifact@v3
              with:
                  path: dist/

    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
